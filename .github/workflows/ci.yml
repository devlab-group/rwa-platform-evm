name: ci
on:
  pull_request:
  push:
    branches: [master]
  # Mythril (symbolic execution) is too slow for the per-PR gate, so the `mythril` job
  # runs weekly and on demand. Slither is the per-PR static-analysis gate.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Every job only reads the repository, so the default token gets read access only
permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: ./.github/actions/forge-deps
      - run: cd contracts && forge build && forge test -vv
      - run: cd contracts && forge fmt --check

  signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: cd signer && go vet ./... && go test -race ./...

  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: cd server && go vet ./... && go test -race ./...
      # ABI/binding drift gate: the hand-written bindings must match the
      # compiled contract artifacts.
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: ./.github/actions/forge-deps
      - run: cd contracts && forge build
      - run: cd server && go run ./cmd/verifyabi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # Match `make ci` (Makefile web-test): typecheck + test + build, not just build.
      - run: cd web && npm ci && npm run typecheck && npm test && npm run build

  # Standalone investor example SPA: self-contained, not embedded by the server
  # (Makefile target investor-web-test)
  investor-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd investor-web && npm ci && npm run typecheck && npm test && npm run build

  # The platform binary embeds the built SPA via go:embed, but the SPA is not committed
  # (only dist/.gitkeep is tracked and assets/ is gitignored). This job builds web/,
  # embeds it and compiles the release binary to show that go:embed resolves the real
  # assets. It also checks that long-lived API-key storage (`rwa.apiKey`) is absent
  # from the bundle and the binary.
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: build web
        run: cd web && npm ci && npm run build
      # Neither the embedded dist directory nor the fresh bundle may contain
      # long-lived API-key storage
      - name: assert embedded SPA has no long-lived API-key storage
        run: |
          for dir in server/internal/webui/dist web/dist; do
            if grep -rlE "rwa\.apiKey|apiKey.*localStorage|localStorage.*apiKey" "$dir" 2>/dev/null; then
              echo "FAIL: $dir still contains long-lived API-key storage"; exit 1
            fi
          done
      - name: compile release binary with fresh embed (binary-embed smoke)
        run: |
          find server/internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
          cp -r web/dist/. server/internal/webui/dist/
          cd server && go build -o /tmp/platform ./cmd/platform
          test -x /tmp/platform
      # The same check against the linked binary
      - name: assert release binary embeds no API-key storage
        run: |
          if strings /tmp/platform | grep -qE "rwa\.apiKey"; then
            echo "FAIL: release binary embeds rwa.apiKey storage"; exit 1
          fi

  # Dependency vulnerability scan on every PR. govulncheck reports only advisories
  # whose vulnerable code the module's call graph reaches, so an unreachable transitive
  # advisory does not fail the build and a reachable one does.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: npm audit (web, production deps)
        run: cd web && npm ci && npm audit --omit=dev --audit-level=high
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: govulncheck (server + signer)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd server && govulncheck ./...)
          (cd signer && govulncheck ./...)
      # CycloneDX SBOMs for the server, signer and web app, uploaded as a workflow
      # artifact for the release record
      - name: SBOM (Go modules + web)
        run: |
          (cd server && go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest app -json -output /tmp/sbom-server.json -main cmd/platform .)
          (cd signer && go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest app -json -output /tmp/sbom-signer.json -main cmd/signer .)
          (cd web && npm ci && npm sbom --sbom-format cyclonedx > /tmp/sbom-web.json)
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: /tmp/sbom-*.json

  # Static-analysis gate: Slither fails the job on High findings. Documented
  # false-positive suppressions are in docs/security/slither-report.md.
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # Slither compiles the Foundry project (crytic-compile runs forge build), so the
      # gitignored contract deps must be installed first
      - uses: ./.github/actions/forge-deps
      - uses: crytic/slither-action@v0.4.2
        with:
          target: contracts
          fail-on: high
          slither-args: --exclude-dependencies

  # Mythril symbolic execution, the slower counterpart to the Slither gate. It runs
  # only on the weekly schedule and on manual workflow_dispatch (see `on:`). The loop
  # below records a failing analysis and fails the job after all contracts are analyzed.
  # Record confirmed false positives in docs/security/ next to the Slither report.
  mythril:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # lib/ (OpenZeppelin, forge-std) is gitignored, so the forge-deps action installs
      # the pinned versions before compiling
      - uses: ./.github/actions/forge-deps
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # setuptools 81 dropped the bundled pkg_resources, which Mythril (via its deps)
      # still imports at runtime, so pin below 81 to avoid a ModuleNotFoundError
      - run: pip install "setuptools<81" mythril
      - name: build contracts
        run: cd contracts && forge build
      # Flatten each deployed contract into one source file (resolving remappings and
      # imports) and analyze it by contract name so the report centers on our code, not
      # the inherited OpenZeppelin base. The solc version matches solc_version in
      # foundry.toml, and each analysis has a 180 second execution timeout.
      - name: mythril analyze
        run: |
          cd contracts
          mkdir -p /tmp/flat
          rc=0
          for c in RWAToken SupplyController Vault RedemptionEscrow ComplianceRegistry \
                   RWAFactory pricing/FixedPriceStrategy; do
            name=$(basename "$c")
            forge flatten "src/$c.sol" -o "/tmp/flat/$name.sol"
            echo "::group::myth analyze $name"
            myth analyze "/tmp/flat/$name.sol:$name" --solv 0.8.24 --execution-timeout 180 || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # Full on-chain + HTTP-API end-to-end flow.
  e2e:
    runs-on: ubuntu-latest
    # No `services:` here: server/e2e/run_e2e.sh starts and tears down its own anvil,
    # MongoDB (a single-node replica set rs0, required by the indexer's transactional
    # CommitChunk) and IPFS
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: ./.github/actions/forge-deps
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: contracts on-chain e2e
        run: cd contracts && bash script/e2e.sh
      - name: server HTTP-API e2e
        run: cd server && bash e2e/run_e2e.sh

  # Not yet pinned to immutable references. Pinning needs tags resolved to SHAs or
  # digests from a registry, so it belongs in a reviewed dependency PR:
  #   - Every `uses:` action to a full 40-character commit SHA, with the tag in a
  #     trailing comment (actions/checkout, setup-go, setup-node, setup-python,
  #     upload-artifact, foundry-rs/foundry-toolchain, crytic/slither-action). For
  #     foundry-toolchain, also pin a Foundry release through its `version:` input.
  #   - `services.mongo.image: mongo:7` in the server job to `mongo@sha256:<digest>`.
  #   - govulncheck and cyclonedx-gomod, installed with `@latest` in this file
  #     (govulncheck also in the Makefile), to exact versions.
  #   - Node "22" and Go "1.26" to exact patch releases.
  # Keep the CycloneDX SBOMs from the security-scan job and the source revision with
  # each release.

name: ci
on:
  pull_request:
  push:
    branches: [master]
  # Mythril symbolic execution runs weekly and on demand because it is too slow for per-PR checks.
  # Slither provides the per-PR static-analysis gate.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Give the workflow token read-only repository contents access
permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: ./.github/actions/forge-deps
      - run: cd contracts && forge build && forge test -vv
      - run: cd contracts && forge fmt --check

  signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: cd signer && go vet ./... && go test -race ./...

  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: cd server && go vet ./... && go test -race ./...
      # Check hand-written bindings against compiled ABIs
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: ./.github/actions/forge-deps
      - run: cd contracts && forge build
      - run: cd server && go run ./cmd/verifyabi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # Match `make ci` (web-test): typecheck, test and build
      - run: cd web && npm ci && npm run typecheck && npm test && npm run build

  # Test the standalone investor SPA, which the server does not embed (investor-web-test)
  investor-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd investor-web && npm ci && npm run typecheck && npm test && npm run build

  # Build the SPA and release binary to verify go:embed resolves real assets.
  # Only dist/.gitkeep is tracked; assets/ is gitignored. Check the bundle for API-key
  # storage patterns and the binary for `rwa.apiKey`.
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: build web
        run: cd web && npm ci && npm run build
      # Check both dist directories for the API-key storage patterns below
      - name: assert embedded SPA has no long-lived API-key storage
        run: |
          for dir in server/internal/webui/dist web/dist; do
            if grep -rlE "rwa\.apiKey|apiKey.*localStorage|localStorage.*apiKey" "$dir" 2>/dev/null; then
              echo "FAIL: $dir still contains long-lived API-key storage"; exit 1
            fi
          done
      - name: compile release binary with fresh embed (binary-embed smoke)
        run: |
          find server/internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
          cp -r web/dist/. server/internal/webui/dist/
          cd server && go build -o /tmp/platform ./cmd/platform
          test -x /tmp/platform
      # Check the linked binary for rwa.apiKey
      - name: assert release binary embeds no API-key storage
        run: |
          if strings /tmp/platform | grep -qE "rwa\.apiKey"; then
            echo "FAIL: release binary embeds rwa.apiKey storage"; exit 1
          fi

  # Scan dependencies on every PR. govulncheck fails on reachable vulnerabilities;
  # unreachable advisories may be reported without failing the build.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: npm audit (web, production deps)
        run: cd web && npm ci && npm audit --omit=dev --audit-level=high
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: govulncheck (server + signer)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd server && govulncheck ./...)
          (cd signer && govulncheck ./...)
      # Upload server, signer and web CycloneDX SBOMs as a release-record artifact
      - name: SBOM (Go modules + web)
        run: |
          (cd server && go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest app -json -output /tmp/sbom-server.json -main cmd/platform .)
          (cd signer && go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest app -json -output /tmp/sbom-signer.json -main cmd/signer .)
          (cd web && npm ci && npm sbom --sbom-format cyclonedx > /tmp/sbom-web.json)
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: /tmp/sbom-*.json

  # Fail on Slither High findings; see docs/security/slither-report.md for documented suppressions
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # Install gitignored dependencies before Slither's crytic-compile invokes forge build
      - uses: ./.github/actions/forge-deps
      - uses: crytic/slither-action@v0.4.2
        with:
          target: contracts
          fail-on: high
          slither-args: --exclude-dependencies

  # Run Mythril weekly or through workflow_dispatch. Collect analysis failures across the list;
  # record confirmed false positives in docs/security/ beside the Slither report.
  mythril:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # Install missing dependencies at forge-deps' pinned OpenZeppelin and forge-std refs
      - uses: ./.github/actions/forge-deps
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Compatibility pin for Mythril dependencies that import pkg_resources
      - run: pip install "setuptools<81" mythril
      - name: build contracts
        run: cd contracts && forge build
      # Flatten imports and remappings, then select each entry contract by name for analysis.
      # Match foundry.toml's solc version and limit each analysis to 180 seconds.
      - name: mythril analyze
        run: |
          cd contracts
          mkdir -p /tmp/flat
          rc=0
          for c in RWAToken SupplyController Vault RedemptionEscrow ComplianceRegistry \
                   RWAFactory pricing/FixedPriceStrategy; do
            name=$(basename "$c")
            forge flatten "src/$c.sol" -o "/tmp/flat/$name.sol"
            echo "::group::myth analyze $name"
            myth analyze "/tmp/flat/$name.sol:$name" --solv 0.8.24 --execution-timeout 180 || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # On-chain and HTTP API E2E flow
  e2e:
    runs-on: ubuntu-latest
    # server/e2e/run_e2e.sh manages Anvil, IPFS and MongoDB itself.
    # MongoDB uses replica set rs0 for the indexer's transactional CommitChunk.
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: ./.github/actions/forge-deps
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: contracts on-chain e2e
        run: cd contracts && bash script/e2e.sh
      - name: server HTTP-API e2e
        run: cd server && bash e2e/run_e2e.sh

  # TODO: pin mutable dependencies in a reviewed dependency PR:
  #   - Every `uses:` action to a full 40-character SHA with its tag in a trailing comment:
  #     checkout, setup-go, setup-node, setup-python, upload-artifact, foundry-toolchain
  #     and slither-action. Also set foundry-toolchain's `version:` to a Foundry release.
  #   - The server job's `services.mongo.image` to `mongo@sha256:<digest>`.
  #   - govulncheck and cyclonedx-gomod from `@latest` to exact versions; update
  #     govulncheck in the Makefile too.
  #   - Node "22" and Go "1.26" to exact patch releases.
  # Keep security-scan's CycloneDX SBOMs and the source revision with each release.

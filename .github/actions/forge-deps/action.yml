name: forge-deps
description: Install the pinned Foundry contract dependencies (OpenZeppelin, forge-std) into contracts/lib.

# Install before compiling: contracts/lib is gitignored, without a submodule or lockfile.
# Missing dependencies make forge build/script fail with "Source ... not found".
# Keep these versions aligned with Makefile's bootstrap target. --no-git avoids submodules;
# --shallow limits clone history. Existing dependency directories are skipped.

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: contracts
      run: |
        [ -d lib/openzeppelin-contracts ] || forge install --no-git --shallow OpenZeppelin/openzeppelin-contracts@v5.6.1
        [ -d lib/forge-std ]              || forge install --no-git --shallow foundry-rs/forge-std@v1.16.2

name: forge-deps
description: Install the pinned Foundry contract dependencies (OpenZeppelin, forge-std) into contracts/lib.

# Install gitignored contracts/lib dependencies before compiling to avoid "Source ... not found".
# Keep refs aligned with Makefile's bootstrap target. Skip existing directories;
# --no-git avoids submodules and --shallow limits clone history.

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: contracts
      run: |
        [ -d lib/openzeppelin-contracts ] || forge install --no-git --shallow OpenZeppelin/openzeppelin-contracts@v5.6.1
        [ -d lib/forge-std ]              || forge install --no-git --shallow foundry-rs/forge-std@v1.16.2

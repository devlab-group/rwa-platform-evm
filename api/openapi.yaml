openapi: 3.0.3
info:
  title: Self-Hosted RWA Platform API
  version: 1.0.0
  description: >
    Self-hosted RWA platform HTTP API. State-changing admin POSTs require Idempotency-Key; errors have stable
    machine-readable codes. Web apps encode and broadcast investor, admin and treasury transactions through
    wallets. The server's on-chain key signs compliance-status changes.
servers:
  - url: http://localhost:8080
security:
  - BearerJwt: []
tags:
  - name: health
  - name: project
  - name: compliance
  - name: assets
  - name: sales
  - name: redemptions
  - name: transactions
  - name: auth

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /readyz:
    get:
      tags: [health]
      operationId: getReady
      security: []
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: Not ready }

  /api/v1/project:
    get:
      tags: [project]
      operationId: getProject
      summary: "Public project and market data"
      description: >
        Public project data. Freeze amounts and latest seizure are admin-only at GET
        /api/v1/project/enforcement; holders read their own frozen amount at GET /api/v1/me/wallet-status.
      security: []
      responses:
        "200": { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }

  /api/v1/project/enforcement:
    get:
      tags: [project]
      operationId: getEnforcement
      summary: "Admin-only ERC-7943 enforcement state"
      description: >
        Admin-only freeze amounts and latest seizure from RWAToken Frozen/ForcedTransfer events. Like GET
        /api/v1/compliance/wallets, this is operational compliance data despite the public chain events. Check
        securityStale before relying on indexed state.
      responses:
        "200": { description: Enforcement state, content: { application/json: { schema: { $ref: "#/components/schemas/Enforcement" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/config:
    get:
      tags: [project]
      operationId: getConfig
      summary: "Public bootstrap chain configuration"
      description: >
        Chain ID, RWAFactory address and configured projectId for wallet-side
        RWAFactory.deploy(ProjectConfig). Available before deployment, when GET /api/v1/project returns 404;
        the server does not relay deployment.
      security: []
      responses:
        "200": { description: Bootstrap config, content: { application/json: { schema: { $ref: "#/components/schemas/BootstrapConfig" } } } }

  /api/v1/profile:
    get:
      tags: [assets]
      operationId: getProfile
      summary: "Fetch the stored asset profile (admin-only)"
      description: >
        Returns the stored Asset Profile and raw document to restore the admin editor after navigation/reload;
        404 if absent. Profiles are immutable per projectId.
      x-required-role: admin
      responses:
        "200": { description: The stored profile., content: { application/json: { schema: { $ref: "#/components/schemas/StoredProfile" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [assets]
      operationId: createProfile
      summary: "Create an immutable asset profile (admin-only)"
      description: >
        Admin-only Asset Profile creation, enforced once per projectId by compare-and-set; POST
        /api/v1/profile/validate only validates. Storage failure returns 500. Record, package and signature
        paths compare the stored digest with the persisted project profileDigest.
      x-required-role: admin
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: "Raw Asset Profile JSON (shared/schemas/asset-profile.schema.json)" } } }
      responses:
        "201": { description: Profile created, content: { application/json: { schema: { $ref: "#/components/schemas/ValidationResult" } } } }
        "400": { description: "Invalid profile: ValidationResult with valid=false and errors array", content: { application/json: { schema: { $ref: "#/components/schemas/ValidationResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/profile/validate:
    post:
      tags: [assets]
      operationId: validateProfile
      summary: "Validate an asset profile without storing it"
      description: >
        Admin-only validation against the platform schema and operator assetSchema dialect. Returns digest/cid
        without storage; POST /api/v1/profile persists it.
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Validation result, content: { application/json: { schema: { $ref: "#/components/schemas/ValidationResult" } } } }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/compliance/wallets:
    get:
      tags: [compliance]
      operationId: listWallets
      x-required-role: admin
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Wallets (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WalletStatus" } } } }
  /api/v1/compliance/challenge:
    post:
      tags: [compliance]
      operationId: createChallenge
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [address], properties: { address: { type: string } } } } }
      responses:
        "200": { description: Challenge, content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } } }
  /api/v1/compliance/challenge/verify:
    post:
      tags: [compliance]
      operationId: verifyChallenge
      description: >
        Verifies the issued wallet challenge signature and returns a short-lived address-scoped session for
        own-status reads and KYC start, without admin authority.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChallengeVerify" } } }
      responses:
        "200": { description: Verified, content: { application/json: { schema: { $ref: "#/components/schemas/VerifyChallengeResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/me/wallet-status:
    get:
      tags: [compliance]
      operationId: getMyWalletStatus
      summary: "Session wallet's own status"
      description: >
        Returns WalletStatus for the challenge-issued X-Wallet-Session address; an admin JWT alone does not
        authorize this route.
      security:
        - WalletSession: []
      responses:
        "200": { description: Own wallet status, content: { application/json: { schema: { $ref: "#/components/schemas/WalletStatus" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/compliance/allowed/{address}:
    get:
      tags: [compliance]
      operationId: isAddressAllowed
      summary: "Public transfer-recipient eligibility preflight"
      description: >
        Returns only address's registry Allowed eligibility, including expiry; omits status, validUntil and
        ownership. Does not check pause, frozen amounts or sender eligibility.
      security: []
      parameters:
        - { name: address, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eligibility, content: { application/json: { schema: { $ref: "#/components/schemas/AllowedResult" } } } }
  /api/v1/compliance/webhooks:
    get:
      tags: [compliance]
      operationId: listWebhookEvents
      x-required-role: admin
      description: "KYC webhook history for the compliance screen"
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Webhook events (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WebhookEvent" } } } }

  /api/v1/audit-logs:
    get:
      tags: [compliance]
      operationId: listAuditLogs
      x-required-role: admin
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: >
            Bounded, paginated audit logs from a most-recent-N query. Sends X-Page-Size and X-Next-Cursor,
            omitting X-Total-Count.
          headers:
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditLog" } } } }
  /api/v1/compliance/status:
    post:
      tags: [compliance]
      operationId: setComplianceStatus
      description: >
        Admin-only ComplianceRegistry.setStatus submission using the server compliance key; returns the
        tracked transaction.
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetStatusRequest" } } }
      responses:
        "202": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/TxRef" } } } }
  /api/v1/compliance/webhook:
    post:
      tags: [compliance]
      operationId: kycWebhook
      description: >
        Authenticates raw-body KYC decisions without BearerJwt. With default kyc.provider: none,
        X-Webhook-Signature carries hex HMAC-SHA256(rawBody, sharedSecret), optionally 0x-prefixed, compared
        in constant time. Sumsub uses X-Payload-Digest; Onfido uses X-SHA2-Signature, each verified with its
        provider secret before mapping to a common decision. Normalized decisions require provider, eventId
        and occurredAt. Deduplicates (provider, eventId) and raw-body hashes; accepts occurredAt from 24 hours
        ago through 5 minutes ahead and rejects decisions older than the wallet's latest decision claim.
        Normalizes addresses to EIP-55; rejects negative validUntil or expiry more than about 100 years ahead.
        The raw-body signature covers occurredAt.
      security: []
      parameters:
        - { name: X-Webhook-Signature, in: header, required: false, description: "Required in none mode; configured Sumsub/Onfido adapters verify X-Payload-Digest or X-SHA2-Signature instead.", schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WebhookPayload" } } }
      responses:
        "202": { description: "Decisions are stored durably; Allowed/Blocked are queued for asynchronous on-chain application, while Pending is recorded without relay. Poll webhook events for applyStatus; 202 does not mean applied. Signed irrelevant events, monitoring-only signals and decisions without usable timestamps are acknowledged without queuing a decision." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { description: "Replay, stale or out-of-order decision conflict", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/compliance/kyc/start:
    post:
      tags: [compliance]
      operationId: startKYC
      summary: "Start KYC for the session wallet"
      description: >
        Starts the configured provider's flow for the X-Wallet-Session address, returning an SDK token or
        hosted URL. Request parameters cannot select another wallet. No on-chain change occurs here;
        authenticated webhook decisions are applied asynchronously. Returns 501 when server-initiated
        verification is unsupported, including provider none.
      security:
        - WalletSession: []
      responses:
        "200": { description: Provider verification session, content: { application/json: { schema: { $ref: "#/components/schemas/KYCSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /api/v1/assets/records:
    get:
      tags: [assets]
      operationId: listRecords
      x-required-role: admin
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Records (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AssetRecord" } } } }
    post:
      tags: [assets]
      operationId: createRecord
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateRecordRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AssetRecord" } } } }
  /api/v1/assets/records/{recordId}/package:
    get:
      tags: [assets]
      operationId: downloadPackage
      x-required-role: admin
      parameters: [ { name: recordId, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: .rwa package, content: { application/zip: { schema: { type: string, format: binary } } } }
  /api/v1/assets/records/{recordId}/reissue:
    post:
      tags: [assets]
      operationId: reissueRecord
      summary: "Reissue an expired record with fresh nonce and expiry"
      description: >
        Admin-only, audited recovery for a Pending record whose attestation expired before signing. Refreshes
        nonce/validUntil while preserving recordId, metadata and digests for another attestation.
      x-required-role: admin
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Reissued, content: { application/json: { schema: { $ref: "#/components/schemas/AssetRecord" } } } }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/sales/inventory:
    get:
      tags: [sales]
      operationId: getInventory
      security: []
      responses:
        "200": { description: Inventory, content: { application/json: { schema: { $ref: "#/components/schemas/Inventory" } } } }
  /api/v1/sales/purchases:
    get:
      tags: [sales]
      operationId: listPurchases
      x-required-role: admin
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Purchases (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Purchase" } } } }

  /api/v1/redemptions:
    get:
      tags: [redemptions]
      operationId: listRedemptions
      description: >
        Public, paginated RedemptionEscrow event projections for investor UIs; filter by beneficiary address,
        status or both.
      security: []
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: address, in: query, required: false, schema: { type: string }, description: "Filter by beneficiary wallet" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Redemptions (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Redemption" } } } }
  /api/v1/redemptions/{id}:
    get:
      tags: [redemptions]
      operationId: getRedemption
      security: []
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: Redemption, content: { application/json: { schema: { $ref: "#/components/schemas/Redemption" } } } }

  /api/v1/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      description: >
        Public, paginated server-tracked transactions for investor UIs; address matches from, to, beneficiary
        or buyer.
      security: []
      parameters:
        - { name: address, in: query, required: false, schema: { type: string }, description: "Filter by wallet involvement (from/to/beneficiary/buyer)" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Transactions (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } } } }

  /auth/challenge:
    post:
      tags: [auth]
      operationId: createAuthChallenge
      summary: "Request an admin-login wallet challenge (step 1)"
      description: >
        Public admin-login entry: send the wallet address for a single-use, expiring personal_sign challenge.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, description: "Wallet address, EIP-55 or lowercase" }
      responses:
        "200":
          description: Challenge issued.
          content:
            application/json:
              schema:
                type: object
                required: [message, expiresAt]
                properties:
                  message: { type: string, description: "Exact message the wallet must personal_sign" }
                  expiresAt: { type: integer, description: "Single-use challenge expiry in Unix seconds" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/session:
    post:
      tags: [auth]
      operationId: createSession
      summary: "Exchange a signed challenge for an admin JWT (step 2)"
      description: >
        Public exchange of address and signed POST /auth/challenge message for an admin JWT; the signer must
        match the configured admin. Use Authorization: Bearer <token> afterwards. JWTs are stateless; logout
        discards them client-side.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, signature]
              properties:
                address: { type: string, description: "Challenge-signing wallet address" }
                signature: { type: string, description: "personal_sign signature (0x-hex, 65 bytes)" }
      responses:
        "200": { description: Authenticated; JWT issued., content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HMAC-signed JWT from POST /auth/session after the configured admin signs a challenge. Use
        Authorization: Bearer <jwt>. No server revocation; logout is client-side. Investors use
        X-Wallet-Session.
    WalletSession:
      type: apiKey
      in: header
      name: X-Wallet-Session
      description: >
        Opaque, wallet-scoped challenge session for own-status reads and KYC start; default TTL 15 minutes
        (security.wallet_session_ttl). Separate from BearerJwt, without admin authority.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >
        Required on state-changing admin POSTs; maximum 256 bytes. Scoped to principal, operation, concrete
        path and normalized query to isolate cached responses across path parameters.
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: >
        Item limit, capped at the server maximum even when omitted or exceeded
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: >
        Opaque X-Next-Cursor from a previous response; omit for the first page
      required: false
      schema: { type: string }
  headers:
    XTotalCount:
      description: "Total available items, when cheaply known"
      schema: { type: integer }
    XPageSize:
      description: "Items returned in this response"
      schema: { type: integer }
    XNextCursor:
      description: >
        Pass as cursor for the next page; absent on the last page
      schema: { type: string }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string }
        chainId: { type: integer }
        lastIndexedBlock: { type: integer }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }
    Project:
      type: object
      properties:
        projectId: { type: string }
        version: { type: string }
        chainId: { type: integer }
        status:
          type: string
          enum: [Undeployed, Deploying, Verifying, Active, Failed]
          description: >
            Deployment lifecycle state; an orphaned deployment event can demote Active to Undeployed.
        verificationNote:
          type: string
          description: >
            Verification or reorg-demotion detail; may explain Failed or a nonfatal gap on Active. Empty when
            no note is needed.
        decimals: { type: integer }
        quoteDecimals:
          type: integer
          description: >
            Cached on-chain quote-token decimals for display scaling; omitted when unresolved or zero
        purchasePricePerWholeToken:
          type: string
          description: >
            Purchase price per whole RWA token in quote-token minimal units (display using quoteDecimals).
            Starts at the deployment price and follows FixedPriceStrategy PurchasePriceUpdated events; omitted
            when unavailable.
        redemptionPricePerWholeToken:
          type: string
          description: >
            Projected redemption price per whole RWA token in quote-token minimal units; see
            purchasePricePerWholeToken.
        tokenUnit: { type: string }
        profileDigest: { type: string }
        legal:
          $ref: "#/components/schemas/LegalDescriptor"
        addresses: { $ref: "#/components/schemas/Addresses" }
        paused: { type: boolean }
        auditor: { type: string }
        treasury: { type: string }
        redemptionManager: { type: string }
        pendingAdmin:
          type: string
          description: >
            Incoming DEFAULT_ADMIN for the first governance contract with a pending two-step transfer,
            projected from scheduling, cancellation and role events; see securityStale. Set while any contract
            awaits acceptance. The console offers wallet acceptance or a Safe batch for a pending Safe.
        finalityConfirmations: { type: integer }
        bytecodeVerified:
          type: boolean
          description: >
            Non-empty code exists at all six project contract addresses; checks presence, not identity against
            released artifacts.
        roles:
          allOf:
            - $ref: "#/components/schemas/RoleHolders"
          description: >
            Platform-defined role holders enumerated on each project contract through AccessControlEnumerable
            and checked against deployment allowlists. After governance projection, follows role events; see
            securityStale.
        securityAsOfBlock:
          type: integer
          description: >
            Last indexed block reflected by authority fields (paused, auditor, treasury, roles); omitted
            before projection.
        securityAsOfTime:
          type: string
          format: date-time
          description: "securityAsOfBlock timestamp (RFC3339); omitted without an as-of time"
        securityStale:
          type: boolean
          description: >
            Authority projection may lag the chain: missing projection/as-of time, missing or unreadable
            checkpoint, reconciliation paused, or projection age over 60 seconds. Clients must not show these
            values as current.
    LegalDescriptor:
      type: object
      description: >
        Issuer declarations from the stored Asset Profile (docs/spec/asset-profile.md); omitted if absent. The
        platform records them without verification.
      required: [wrapper]
      properties:
        wrapper: { type: string, enum: [share, entitlement, certificate, claim] }
        issuerLei: { type: string, description: "ISO 17442 Legal Entity Identifier." }
        holderRights: { type: string }
        redemptionTerms: { $ref: "#/components/schemas/DocumentReference" }
        maturityDate: { type: string, format: date }
        rating:
          type: object
          required: [provider, uri, sha256]
          properties:
            provider: { type: string }
            grade: { type: string }
            uri: { type: string }
            sha256: { type: string }
    DocumentReference:
      type: object
      description: >
        Issuer document reference with lowercase-hex SHA-256. Link uri only if it parses as https:; otherwise
        show text. Both admin and investor apps follow this rule.
      required: [uri, sha256]
      properties:
        uri: { type: string }
        sha256: { type: string }
    Addresses:
      type: object
      properties:
        token: { type: string }
        compliance: { type: string }
        supplyController: { type: string }
        vault: { type: string }
        redemptionEscrow: { type: string }
        strategy: { type: string }
        quoteToken: { type: string }
    Enforcement:
      type: object
      description: >
        Admin-only ERC-7943 state from GET /api/v1/project/enforcement
      properties:
        frozenBalances:
          type: object
          additionalProperties: { type: string }
          description: >
            Holder-to-frozen-amount map in RWA minimal units as base-10 uint256 strings. Frozen events replace
            absolute amounts; zero releases a hold. Holds may exceed balances and withhold future receipts.
            Omitted when no holds exist.
        lastForcedTransfer:
          allOf:
            - $ref: "#/components/schemas/ForcedTransfer"
          description: >
            Latest admin seizure and chain coordinates; omitted if none. Use indexed events/transactions for
            history.
        securityAsOfBlock:
          type: integer
          description: "Last indexed block reflected; omitted without a checkpoint"
        securityAsOfTime:
          type: string
          format: date-time
          description: Timestamp of securityAsOfBlock (RFC3339).
        securityStale:
          type: boolean
          description: >
            Projection may lag the chain; same freshness rules as Project.securityStale
    ForcedTransfer:
      type: object
      description: "ERC-7943 forced transfer at its canonical log position"
      properties:
        from: { type: string, description: "Holder the tokens were seized from" }
        to: { type: string, description: "Recipient, required to be Allowed on-chain" }
        amount: { type: string, description: "Token minimal units as a base-10 string" }
        txHash: { type: string }
        blockNumber: { type: integer, format: int64 }
        logIndex: { type: integer }
    RoleHolders:
      type: object
      additionalProperties: { type: array, items: { type: string } }
      description: "Role name (DEFAULT_ADMIN_ROLE, PAUSER_ROLE, ...) to holder-address map"
    BootstrapConfig:
      type: object
      description: >
        Public bootstrap values. The console combines projectId with stored profile digest/decimals, then
        broadcasts RWAFactory.deploy through the admin wallet. The server observes ProjectDeployed without
        signing or relaying deployment.
      required: [chainId, factoryAddress, projectId]
      properties:
        chainId: { type: integer, format: int64, description: "Factory's EVM chain ID" }
        factoryAddress: { type: string, description: "RWAFactory address for wallet-side deploy(ProjectConfig)" }
        projectId:
          type: string
          description: >
            Configured contract.project_id UUID; the console uses it in the Asset Profile and the server
            rejects mismatches. If unset, returns empty and the console blocks profile creation.
    ValidationResult:
      type: object
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
        profileDigest: { type: string }
        cid: { type: string }
    WalletStatus:
      type: object
      properties:
        address: { type: string }
        status: { type: string, enum: [Unknown, Allowed, Blocked] }
        validUntil: { type: integer }
        ownershipVerified: { type: boolean }
        frozenTokens:
          type: string
          description: >
            Own frozen amount in RWA minimal units as a base-10 string; omitted without a hold. Tokens remain
            in the wallet but cannot be spent through ordinary transfers. Only the caller's amount is exposed
            at GET /me/wallet-status; the aggregate map is admin-only.
    VerifyChallengeResult:
      type: object
      description: "Verified wallet status and short-lived address-scoped session"
      properties:
        address: { type: string }
        status: { type: string, enum: [Unknown, Allowed, Blocked] }
        validUntil: { type: integer }
        ownershipVerified: { type: boolean }
        sessionToken: { type: string, description: "Address-scoped opaque bearer for X-Wallet-Session" }
        sessionExpiresAt: { type: string, format: date-time, description: "Session expiry; default 15 minutes after issue" }
    AllowedResult:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean, description: "Registry Allowed eligibility including expiry; no pause, freeze or sender checks, and no other wallet state." }
    Challenge:
      type: object
      properties:
        address: { type: string }
        nonce: { type: string }
        message: { type: string }
        expiresAt: { type: string }
    SetStatusRequest:
      type: object
      required: [address, status]
      properties:
        address: { type: string }
        status: { type: string, enum: [Unknown, Allowed, Blocked] }
        validUntil: { type: integer }
    AssetRecord:
      type: object
      description: >
        recordKey, nonce and validUntil supply wallet-side SupplyController.MintAttestation/mint. The server
        does not relay mint; it advances the record after observing Minted.
      properties:
        recordId: { type: string }
        status: { type: string, enum: [Draft, Pending, Signed, Minted, Rejected] }
        metadataDigest: { type: string }
        cid: { type: string }
        amount: { type: string }
        createdAt: { type: string }
        recordKey: { type: string, description: "MintAttestation bytes32 recordKey; consumed once on-chain" }
        nonce: { type: string, description: "uint256 attestation nonce; consumed once on-chain" }
        validUntil: { type: integer, format: int64, description: "Attestation expiry in Unix seconds; mint requires block.timestamp <= validUntil" }
    CreateRecordRequest:
      type: object
      required: [recordId, asset, amount]
      properties:
        recordId: { type: string }
        asset: { type: object }
        amount: { type: string }
        proofs: { type: array, items: { type: object } }
    SignedResult:
      type: object
      required: [formatVersion, auditor, primaryType, typedDataDigest, signature, signedAt]
      properties:
        formatVersion: { type: string }
        auditor: { type: string }
        primaryType: { type: string }
        typedDataDigest: { type: string }
        signature: { type: string }
        signedAt: { type: string }
    Inventory:
      type: object
      properties:
        inventory: { type: string }
        quoteBalance: { type: string }
        purchasePrice: { type: string }
        redemptionPrice: { type: string }
    Redemption:
      type: object
      description: >
        On-chain status, plus server-derived claimable: Funded with confirmations >= finalityConfirmations.
        Claimable is not an on-chain enum member; Pending does not guarantee payment.
      properties:
        id: { type: string }
        beneficiary: { type: string }
        rwaAmount: { type: string }
        quoteAmount: { type: string }
        status: { type: string, enum: [None, Pending, Funded, Completed, Rejected, Cancelled] }
        claimable: { type: boolean }
        createdAt: { type: integer }
        timeoutAt: { type: integer }
        beneficiaryAllowed: { type: boolean }
        confirmations: { type: integer }
    ChallengeVerify:
      type: object
      required: [address, nonce, signature]
      properties:
        address: { type: string }
        nonce: { type: string }
        signature: { type: string }
    WebhookPayload:
      type: object
      required: [provider, eventId, occurredAt, address, status]
      properties:
        provider: { type: string, description: "KYC provider ID; part of the (provider,eventId) uniqueness key" }
        eventId: { type: string, description: "Provider event ID; part of the uniqueness key" }
        occurredAt: { type: integer, format: int64, description: "Provider decision time in Unix seconds; rejects age over 24 hours, future skew over 5 minutes, or a decision older than the wallet's latest decision claim." }
        address: { type: string, description: "Subject wallet, normalized to EIP-55 server-side" }
        status: { type: string, enum: [Allowed, Blocked, Pending], description: "Compliance decision." }
        validUntil: { type: integer, format: int64, description: "Allowed expiry in Unix seconds; 0 disables expiry. Negative values and expiry more than about 100 years ahead are rejected." }
    KYCSession:
      type: object
      description: >
        Verification credentials for the session wallet: exactly one of token (embedded SDK) or url (hosted
        flow), selected by provider.
      required: [provider]
      properties:
        provider: { type: string, enum: [sumsub, onfido, generic], description: "Provider ID selecting the SPA SDK" }
        token: { type: string, description: "Provider SDK token" }
        url: { type: string, description: "Hosted verification URL" }
        ref: { type: string, description: "Provider reference (Onfido workflowRunId), stored against the wallet to resolve webhook subjects." }
        expiresAt: { type: string, format: date-time, description: "Token/URL expiry" }
    WebhookEvent:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        address: { type: string }
        provider: { type: string }
        outcome: { type: string, enum: [Allowed, Blocked, Pending] }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string }
        applyStatus: { type: string, enum: [Accepted, Applying, Applied, Superseded, Failed, Recorded], description: "Durable inbox/outbox state; Applied after setStatus confirms on-chain" }
        applied: { type: boolean, description: "Derived from applyStatus == Applied" }
    AuditLog:
      type: object
      properties:
        id: { type: string }
        category: { type: string }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        createdAt: { type: string }
        details: { type: object }
    Purchase:
      type: object
      properties:
        txHash: { type: string }
        buyer: { type: string }
        recipient: { type: string }
        tokenAmount: { type: string }
        quoteAmount: { type: string }
        blockNumber: { type: integer }
        confirmations: { type: integer }
    TxRef:
      type: object
      properties:
        txHash: { type: string }
        status: { type: string }
        idempotencyKey: { type: string }
    Transaction:
      type: object
      properties:
        txHash: { type: string }
        kind: { type: string }
        status: { type: string, enum: [pending, mined, confirmed, replaced, reverted, reorged, failed, broadcast_unknown, nonce_consumed_externally, needs_intervention] }
        blockNumber: { type: integer }
        explorerUrl: { type: string }
        # Identity and replacement lineage of a stuck or needs_intervention transaction
        sender: { type: string, description: "Signing account (from)" }
        nonce: { type: integer, description: "Account nonce used by this attempt" }
        replacedBy: { type: string, description: "Replacement txHash, if replaced" }
        replacementCount: { type: integer, description: "Fee-bump/replacement count for this nonce" }
    StoredProfile:
      type: object
      description: >
        Stored Asset Profile from GET /api/v1/profile: raw document and server-derived identity
      required: [profile, projectId, profileDigest]
      properties:
        profile: { type: object, description: "Stored raw Asset Profile JSON" }
        projectId: { type: string }
        profileDigest: { type: string }
        cid: { type: string }
        decimals: { type: integer, description: "Profile-derived token decimals" }
        tokenUnit: { type: string }
    AuthSession:
      type: object
      description: "Admin JWT and metadata from POST /auth/session"
      required: [token, expiresAt, role, address]
      properties:
        token: { type: string, description: "JWT for Authorization: Bearer <token>" }
        expiresAt: { type: integer, description: "JWT expiry in Unix seconds" }
        role: { type: string, description: "V1 uses the single-admin role 'admin'" }
        address: { type: string, description: "Authenticated admin address, checksummed" }

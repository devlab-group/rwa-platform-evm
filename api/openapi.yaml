openapi: 3.0.3
info:
  title: Self-Hosted RWA Platform API
  version: 1.0.0
  description: >
    HTTP API for the self-hosted RWA platform. Admin POST routes that change state require
    Idempotency-Key. Errors have stable machine-readable codes. The web apps encode investor,
    admin and treasury wallet transactions and broadcast through the connected wallet. The server
    encodes and signs compliance-status transactions with its only on-chain key.
servers:
  - url: http://localhost:8080
security:
  - BearerJwt: []
tags:
  - name: health
  - name: project
  - name: compliance
  - name: assets
  - name: sales
  - name: redemptions
  - name: transactions
  - name: auth

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /readyz:
    get:
      tags: [health]
      operationId: getReady
      security: []
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: Not ready }

  /api/v1/project:
    get:
      tags: [project]
      operationId: getProject
      summary: Public project/market data.
      description: >
        Public project data for investor clients. Per-wallet freeze amounts and the latest seizure are
        admin-only at GET /api/v1/project/enforcement. Holders read their own frozen amount at GET
        /api/v1/me/wallet-status.
      security: []
      responses:
        "200": { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }

  /api/v1/project/enforcement:
    get:
      tags: [project]
      operationId: getEnforcement
      summary: ERC-7943 enforcement state (admin only).
      description: >
        Admin-only freeze amounts and latest forced transfer, projected from RWAToken's Frozen and
        ForcedTransfer events. These identify wallets subject to enforcement and are treated as
        operational compliance data, like GET /api/v1/compliance/wallets, although the events are
        public on-chain. See securityStale before using indexed state.
      responses:
        "200": { description: Enforcement state, content: { application/json: { schema: { $ref: "#/components/schemas/Enforcement" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/config:
    get:
      tags: [project]
      operationId: getConfig
      summary: Bootstrap chain configuration (public).
      description: >
        Public chain ID, RWAFactory address and configured projectId for assembling
        RWAFactory.deploy(ProjectConfig) in the admin wallet. Available before deployment, when GET
        /api/v1/project returns 404. The server does not relay deployment.
      security: []
      responses:
        "200": { description: Bootstrap config, content: { application/json: { schema: { $ref: "#/components/schemas/BootstrapConfig" } } } }

  /api/v1/profile:
    get:
      tags: [assets]
      operationId: getProfile
      summary: Fetch the deployment's stored asset profile, if one exists (admin-only).
      description: >
        Returns this deployment's stored Asset Profile, including its raw document, so the admin UI
        can restore the editor after navigation or reload. Returns 404 before a profile exists. Each
        deployment has one profile.
      x-required-role: admin
      responses:
        "200": { description: The stored profile., content: { application/json: { schema: { $ref: "#/components/schemas/StoredProfile" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [assets]
      operationId: createProfile
      summary: Create the deployment's asset profile (admin-only, create-once).
      description: >
        Admin-only, create-once storage of the deployment's Asset Profile, using a compare-and-set on
        projectId. The profile is immutable; POST /api/v1/profile/validate only validates. Storage
        failure returns 500. Record, package and signature paths check the stored digest against the
        project's persisted profileDigest.
      x-required-role: admin
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: "Raw Asset Profile JSON document (shared/schemas/asset-profile.schema.json)." } } }
      responses:
        "201": { description: Profile created, content: { application/json: { schema: { $ref: "#/components/schemas/ValidationResult" } } } }
        "400": { description: "Invalid profile; body is a ValidationResult with valid=false and an errors array.", content: { application/json: { schema: { $ref: "#/components/schemas/ValidationResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/profile/validate:
    post:
      tags: [assets]
      operationId: validateProfile
      summary: Validate an asset profile (pure, no persistence).
      description: >
        Admin-only validation against the platform schema and operator assetSchema dialect. Returns
        digest and cid without storing the profile; use POST /api/v1/profile to persist it.
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Validation result, content: { application/json: { schema: { $ref: "#/components/schemas/ValidationResult" } } } }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/compliance/wallets:
    get:
      tags: [compliance]
      operationId: listWallets
      x-required-role: admin
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Wallets (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WalletStatus" } } } }
  /api/v1/compliance/challenge:
    post:
      tags: [compliance]
      operationId: createChallenge
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [address], properties: { address: { type: string } } } } }
      responses:
        "200": { description: Challenge, content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } } }
  /api/v1/compliance/challenge/verify:
    post:
      tags: [compliance]
      operationId: verifyChallenge
      description: >
        Verifies a wallet signature over its issued challenge and returns a short-lived session scoped
        to address. The session lets investors read their own status without an admin credential.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChallengeVerify" } } }
      responses:
        "200": { description: Verified, content: { application/json: { schema: { $ref: "#/components/schemas/VerifyChallengeResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/me/wallet-status:
    get:
      tags: [compliance]
      operationId: getMyWalletStatus
      summary: This session's own wallet status (subject-scoped).
      description: >
        Returns WalletStatus for the address in the X-Wallet-Session token issued by challenge
        verification. Admin JWTs do not authorize this route.
      security:
        - WalletSession: []
      responses:
        "200": { description: Own wallet status, content: { application/json: { schema: { $ref: "#/components/schemas/WalletStatus" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/compliance/allowed/{address}:
    get:
      tags: [compliance]
      operationId: isAddressAllowed
      summary: Public transfer-preflight eligibility.
      description: >
        Public transfer-recipient preflight returning only the registry's Allowed eligibility for
        address. It omits exact status, validUntil and ownership details. This does not check token
        pause, frozen amounts or sender eligibility.
      security: []
      parameters:
        - { name: address, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eligibility, content: { application/json: { schema: { $ref: "#/components/schemas/AllowedResult" } } } }
  /api/v1/compliance/webhooks:
    get:
      tags: [compliance]
      operationId: listWebhookEvents
      x-required-role: admin
      description: KYC webhook history for the compliance screen.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Webhook events (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WebhookEvent" } } } }

  /api/v1/audit-logs:
    get:
      tags: [compliance]
      operationId: listAuditLogs
      x-required-role: admin
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: >
            Audit log entries (bounded/paginated; the
            underlying store is a most-recent-N query so X-Total-Count is
            omitted; only X-Page-Size and X-Next-Cursor are sent).
          headers:
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditLog" } } } }
  /api/v1/compliance/status:
    post:
      tags: [compliance]
      operationId: setComplianceStatus
      description: >
        Admin-only. Submits ComplianceRegistry.setStatus with the server's compliance
        key and returns the tracked transaction.
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetStatusRequest" } } }
      responses:
        "202": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/TxRef" } } } }
  /api/v1/compliance/webhook:
    post:
      tags: [compliance]
      operationId: kycWebhook
      description: >
        Accepts signed KYC decisions without BearerJwt. With kyc.provider: none (default), X-Webhook-
        Signature is lowercase hex HMAC-SHA256(rawBody, sharedSecret), compared in constant time. A
        configured Sumsub or Onfido adapter instead verifies X-Payload-Digest or X-SHA2-Signature with
        its provider secret and maps the payload to the same decision format. Decisions require
        provider, eventId and occurredAt. The server deduplicates (provider, eventId) and the raw-body
        hash, accepts timestamps from 24 hours ago through 5 minutes ahead, and rejects decisions
        older than the latest applied decision for the wallet. It normalizes addresses to EIP-55 and
        rejects negative validUntil or values more than about 100 years ahead. The raw-body signature
        also covers occurredAt.
      security: []
      parameters:
        - { name: X-Webhook-Signature, in: header, required: false, description: "Required for the generic shape; a configured provider sends its own header instead (X-Payload-Digest / X-SHA2-Signature). Exactly one signature header must verify.", schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WebhookPayload" } } }
      responses:
        "202": { description: "Valid decisions are durably queued for asynchronous on-chain application; poll webhook events for applyStatus. Acknowledgement does not mean applied. Irrelevant signed provider events, monitoring-only signals and provider decisions without a usable timestamp are also acknowledged but are not queued as decisions." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { description: "Replay/stale/out-of-order decision (same code family as replay).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/compliance/kyc/start:
    post:
      tags: [compliance]
      operationId: startKYC
      summary: Begin a KYC verification for this session's own wallet.
      description: >
        Starts verification for the wallet in X-Wallet-Session with the configured provider and
        returns its SDK token or hosted URL. The wallet cannot be selected by a request parameter.
        This call changes no on-chain state; approval is applied asynchronously after the provider's
        signed webhook. Returns 501 for providers without a server-initiated flow, including the
        default none provider.
      security:
        - WalletSession: []
      responses:
        "200": { description: Provider verification session, content: { application/json: { schema: { $ref: "#/components/schemas/KYCSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }

  /api/v1/assets/records:
    get:
      tags: [assets]
      operationId: listRecords
      x-required-role: admin
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Records (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AssetRecord" } } } }
    post:
      tags: [assets]
      operationId: createRecord
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateRecordRequest" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AssetRecord" } } } }
  /api/v1/assets/records/{recordId}/package:
    get:
      tags: [assets]
      operationId: downloadPackage
      x-required-role: admin
      parameters: [ { name: recordId, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: .rwa package, content: { application/zip: { schema: { type: string, format: binary } } } }
  /api/v1/assets/records/{recordId}/reissue:
    post:
      tags: [assets]
      operationId: reissueRecord
      summary: Reissue an expired record with a fresh nonce and expiry.
      description: >
        Admin-only audited recovery for a Pending record whose attestation window expired before
        signing. Replaces nonce and validUntil while keeping recordId, metadata and digests, allowing
        another attestation without a duplicate record ID.
      x-required-role: admin
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Reissued, content: { application/json: { schema: { $ref: "#/components/schemas/AssetRecord" } } } }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/sales/inventory:
    get:
      tags: [sales]
      operationId: getInventory
      security: []
      responses:
        "200": { description: Inventory, content: { application/json: { schema: { $ref: "#/components/schemas/Inventory" } } } }
  /api/v1/sales/purchases:
    get:
      tags: [sales]
      operationId: listPurchases
      x-required-role: admin
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Purchases (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Purchase" } } } }

  /api/v1/redemptions:
    get:
      tags: [redemptions]
      operationId: listRedemptions
      description: >
        Public, paginated redemption requests derived from RedemptionEscrow events for issuer-built
        investor UIs. Filter by beneficiary address, status or both.
      security: []
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: address, in: query, required: false, schema: { type: string }, description: "Filter to requests whose beneficiary is this wallet." }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Redemptions (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Redemption" } } } }
  /api/v1/redemptions/{id}:
    get:
      tags: [redemptions]
      operationId: getRedemption
      security: []
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: Redemption, content: { application/json: { schema: { $ref: "#/components/schemas/Redemption" } } } }

  /api/v1/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      description: >
        Public, paginated server-tracked transactions for issuer-built investor UIs. Filter by address
        to match from, to, beneficiary or buyer.
      security: []
      parameters:
        - { name: address, in: query, required: false, schema: { type: string }, description: "Filter to txs involving this wallet (from/to/beneficiary/buyer)." }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "Transactions (bounded/paginated, see Limit/Cursor)"
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            X-Page-Size: { $ref: "#/components/headers/XPageSize" }
            X-Next-Cursor: { $ref: "#/components/headers/XNextCursor" }
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } } } }

  /auth/challenge:
    post:
      tags: [auth]
      operationId: createAuthChallenge
      summary: Request a wallet-signature challenge for admin login (step 1).
      description: >
        Public admin login entry point. Send the connected wallet address to receive a single-use,
        time-limited challenge for personal_sign.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, description: "Connected wallet address (EIP-55 checksummed or lowercase)." }
      responses:
        "200":
          description: Challenge issued.
          content:
            application/json:
              schema:
                type: object
                required: [message, expiresAt]
                properties:
                  message: { type: string, description: "The exact message the wallet must personal_sign." }
                  expiresAt: { type: integer, description: "Unix seconds; the challenge is single-use and expires." }
        "429": { $ref: "#/components/responses/Error" }
  /auth/session:
    post:
      tags: [auth]
      operationId: createSession
      summary: Verify a signed challenge and issue an admin JWT (step 2).
      description: >
        Public exchange of the wallet address and signed POST /auth/challenge message for an admin
        JWT. The recovered signer must equal the configured admin. Send Authorization: Bearer <token>
        on subsequent requests. The JWT is stateless; logout removes it client-side.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, signature]
              properties:
                address: { type: string, description: "Wallet address that signed the challenge." }
                signature: { type: string, description: "personal_sign signature over the challenge message ('0x'-hex, 65 bytes)." }
      responses:
        "200": { description: Authenticated; JWT issued., content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HMAC-signed admin JWT from POST /auth/session after a wallet challenge signed by the
        configured admin. Send Authorization: Bearer <jwt>. No server-side revocation exists; logout
        removes the token locally. Investors use X-Wallet-Session.
    WalletSession:
      type: apiKey
      in: header
      name: X-Wallet-Session
      description: >
        Opaque session from challenge verification, scoped to one wallet for status reads and KYC
        initiation. Defaults to 15 minutes (security.wallet_session_ttl). Separate from BearerJwt and
        carries no admin authority.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >
        Required on authenticated admin POST routes that change state; at most 256 bytes. Scoped to
        principal, operation, concrete path and normalized query, so different path parameters cannot
        share a cached response.
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: >
        Maximum items to return. The server caps the value at the maximum, including
        when the parameter is omitted or set higher.
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: >
        Opaque pagination cursor from a previous response's X-Next-Cursor
        header. Omit to fetch the first page.
      required: false
      schema: { type: string }
  headers:
    XTotalCount:
      description: Total items available, when cheaply known.
      schema: { type: integer }
    XPageSize:
      description: Items actually returned in this response.
      schema: { type: integer }
    XNextCursor:
      description: >
        Pass as `cursor` to fetch the next page; absent once this was the
        last page.
      schema: { type: string }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string }
        chainId: { type: integer }
        lastIndexedBlock: { type: integer }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }
    Project:
      type: object
      properties:
        projectId: { type: string }
        version: { type: string }
        chainId: { type: integer }
        status:
          type: string
          enum: [Undeployed, Deploying, Verifying, Active, Failed]
          description: >
            Deployment lifecycle state. Active and Failed are the terminal states.
        verificationNote:
          type: string
          description: >
            Deployment verification or reorg-demotion detail. May explain a Failed deployment or a non-
            fatal verification gap on an Active project; empty when no note is needed.
        decimals: { type: integer }
        quoteDecimals:
          type: integer
          description: >
            Quote-token decimals, read on-chain at setup and stored for scaling quote amounts without a
            client-side read. Omitted until resolved.
        purchasePricePerWholeToken:
          type: string
          description: >
            Purchase price per whole token, in quote-token minimal units (scale by
            quoteDecimals for display). It starts at the deploy-time price and follows
            FixedPriceStrategy PurchasePriceUpdated events. Omitted if not yet projected.
        redemptionPricePerWholeToken:
          type: string
          description: >
            Live on-chain redemption price per whole token, in quote-token minimal units.
            See purchasePricePerWholeToken.
        tokenUnit: { type: string }
        profileDigest: { type: string }
        legal:
          $ref: "#/components/schemas/LegalDescriptor"
        addresses: { $ref: "#/components/schemas/Addresses" }
        paused: { type: boolean }
        auditor: { type: string }
        treasury: { type: string }
        redemptionManager: { type: string }
        pendingAdmin:
          type: string
          description: >
            Incoming DEFAULT_ADMIN address for the first governance contract with a pending two-step
            transfer. Projected from scheduling, cancellation and role events; see securityStale. Remains
            set while any contract awaits acceptance. The admin console offers acceptance to the matching
            wallet or a Safe batch for a pending Safe.
        finalityConfirmations: { type: integer }
        bytecodeVerified:
          type: boolean
          description: >
            True when non-empty code exists at every deployed address. This is a presence
            check; it does not compare the code with released artifacts.
        roles:
          allOf:
            - $ref: "#/components/schemas/RoleHolders"
          description: >
            Holders of every role on every deployed contract, enumerated through
            AccessControlEnumerable. Deployment verification compares them with the deploy
            allowlist to detect an unexpected holder. Once the governance projection exists,
            the sets follow role events; see securityStale.
        securityAsOfBlock:
          type: integer
          description: >
            Last indexed block the security-authority fields (paused, auditor, treasury, roles)
            reflect. Omitted before the first projection.
        securityAsOfTime:
          type: string
          format: date-time
          description: Timestamp of securityAsOfBlock (RFC3339). Omitted when no checkpoint exists.
        securityStale:
          type: boolean
          description: >
            True when indexed authority fields may lag the chain: no projection, missing or unreadable
            checkpoint, reconciliation paused, or a projection older than 60 seconds. Clients must not
            show these values as current.
    LegalDescriptor:
      type: object
      description: >
        The issuer's instrument description from the stored Asset Profile
        (docs/spec/asset-profile.md), omitted when absent from the profile.
        The platform records these declarations without verifying them.
      required: [wrapper]
      properties:
        wrapper: { type: string, enum: [share, entitlement, certificate, claim] }
        issuerLei: { type: string, description: "ISO 17442 Legal Entity Identifier." }
        holderRights: { type: string }
        redemptionTerms: { $ref: "#/components/schemas/DocumentReference" }
        maturityDate: { type: string, format: date }
        rating:
          type: object
          required: [provider, uri, sha256]
          properties:
            provider: { type: string }
            grade: { type: string }
            uri: { type: string }
            sha256: { type: string }
    DocumentReference:
      type: object
      description: >
        An issuer-referenced document pinned by its SHA-256 in lowercase hex.
        Clients must link uri only when it parses as an https: URL; otherwise,
        show it as text. The admin console and investor app follow this rule.
      required: [uri, sha256]
      properties:
        uri: { type: string }
        sha256: { type: string }
    Addresses:
      type: object
      properties:
        token: { type: string }
        compliance: { type: string }
        supplyController: { type: string }
        vault: { type: string }
        redemptionEscrow: { type: string }
        strategy: { type: string }
        quoteToken: { type: string }
    Enforcement:
      type: object
      description: >
        ERC-7943 (uRWA) enforcement state for the deployed project. Admin-only; returned by
        GET /api/v1/project/enforcement.
      properties:
        frozenBalances:
          type: object
          additionalProperties: { type: string }
          description: >
            Holder address to frozen amount in token minimal units, encoded as a base-10 string to
            preserve uint256 values. Frozen events replace absolute amounts; zero removes the hold. A hold
            may exceed the balance and withhold future receipts. Omitted when no holder has a frozen
            amount.
        lastForcedTransfer:
          allOf:
            - $ref: "#/components/schemas/ForcedTransfer"
          description: >
            Latest admin seizure with chain coordinates. For history, use indexed chain events and the
            transaction list. Omitted when none has occurred.
        securityAsOfBlock:
          type: integer
          description: Last indexed block this projection reflects. Omitted with no checkpoint.
        securityAsOfTime:
          type: string
          format: date-time
          description: Timestamp of securityAsOfBlock (RFC3339).
        securityStale:
          type: boolean
          description: >
            True when the projection may lag the chain. Computed as for the field of the same
            name on Project.
    ForcedTransfer:
      type: object
      description: One ERC-7943 forced transfer, identified by its canonical log position.
      properties:
        from: { type: string, description: "Holder the tokens were seized from." }
        to: { type: string, description: "Recipient, which had to be compliance-Allowed on-chain." }
        amount: { type: string, description: "Amount moved, in token minimal units (base-10 string)." }
        txHash: { type: string }
        blockNumber: { type: integer, format: int64 }
        logIndex: { type: integer }
    RoleHolders:
      type: object
      additionalProperties: { type: array, items: { type: string } }
      description: Map of role name (DEFAULT_ADMIN_ROLE, PAUSER_ROLE, ...) to holder addresses.
    BootstrapConfig:
      type: object
      description: >
        Public bootstrap values for the admin console. It builds ProjectConfig from the configured
        projectId and stored profile digest and decimals, then broadcasts RWAFactory.deploy through
        the admin wallet. The server observes ProjectDeployed without signing or relaying deployment.
      required: [chainId, factoryAddress, projectId]
      properties:
        chainId: { type: integer, format: int64, description: "EVM chain id the factory is deployed on." }
        factoryAddress: { type: string, description: "RWAFactory address the admin calls deploy(ProjectConfig) on." }
        projectId:
          type: string
          description: >
            The projectId (UUID) this deployment is pinned to by `contract.project_id` in the
            server config. The admin console uses it in the Asset Profile, and the server
            rejects a profile whose projectId differs. Empty when the operator has not set it;
            the console then blocks profile creation.
    ValidationResult:
      type: object
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
        profileDigest: { type: string }
        cid: { type: string }
    WalletStatus:
      type: object
      properties:
        address: { type: string }
        status: { type: string, enum: [Unknown, Allowed, Blocked] }
        validUntil: { type: integer }
        ownershipVerified: { type: boolean }
        frozenTokens:
          type: string
          description: >
            This wallet's ERC-7943 frozen amount in minimal units as a base-10 string. Frozen tokens
            remain in the wallet but cannot be sent. Omitted when no hold exists. Reported only for the
            caller's address at GET /me/wallet-status; the aggregate map is admin-only.
    VerifyChallengeResult:
      type: object
      description: WalletStatus for the verified address plus a short-lived subject-scoped session.
      properties:
        address: { type: string }
        status: { type: string, enum: [Unknown, Allowed, Blocked] }
        validUntil: { type: integer }
        ownershipVerified: { type: boolean }
        sessionToken: { type: string, description: "Opaque bearer for X-Wallet-Session; scoped to this address only." }
        sessionExpiresAt: { type: string, format: date-time, description: "Session expiry (15 minutes after issue by default)." }
    AllowedResult:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean, description: "Registry Allowed eligibility for the address, including expiry. Does not check token pause, frozen amounts or sender eligibility; reveals no other state." }
    Challenge:
      type: object
      properties:
        address: { type: string }
        nonce: { type: string }
        message: { type: string }
        expiresAt: { type: string }
    SetStatusRequest:
      type: object
      required: [address, status]
      properties:
        address: { type: string }
        status: { type: string, enum: [Unknown, Allowed, Blocked] }
        validUntil: { type: integer }
    AssetRecord:
      type: object
      description: >
        recordKey, nonce and validUntil let the admin assemble the
        SupplyController.MintAttestation and broadcast SupplyController.mint(attestation,
        signature) from their wallet. The server does not relay the mint; it observes the
        on-chain Minted event and advances the record.
      properties:
        recordId: { type: string }
        status: { type: string, enum: [Draft, Pending, Signed, Minted, Rejected] }
        metadataDigest: { type: string }
        cid: { type: string }
        amount: { type: string }
        createdAt: { type: string }
        recordKey: { type: string, description: "bytes32 recordKey bound into the MintAttestation (consumed once on-chain)." }
        nonce: { type: string, description: "uint256 attestation nonce (consumed once on-chain)." }
        validUntil: { type: integer, format: int64, description: "Attestation expiry (unix seconds); block.timestamp must be <= this at mint." }
    CreateRecordRequest:
      type: object
      required: [recordId, asset, amount]
      properties:
        recordId: { type: string }
        asset: { type: object }
        amount: { type: string }
        proofs: { type: array, items: { type: object } }
    SignedResult:
      type: object
      required: [formatVersion, auditor, primaryType, typedDataDigest, signature, signedAt]
      properties:
        formatVersion: { type: string }
        auditor: { type: string }
        primaryType: { type: string }
        typedDataDigest: { type: string }
        signature: { type: string }
        signedAt: { type: string }
    Inventory:
      type: object
      properties:
        inventory: { type: string }
        quoteBalance: { type: string }
        purchasePrice: { type: string }
        redemptionPrice: { type: string }
    Redemption:
      type: object
      description: >
        `status` is the on-chain enum. `claimable` is derived by the server: true when
        status is Funded and confirmations is at least finalityConfirmations. There is no
        on-chain Claimable status. A Pending redemption is not a payment guarantee.
      properties:
        id: { type: string }
        beneficiary: { type: string }
        rwaAmount: { type: string }
        quoteAmount: { type: string }
        status: { type: string, enum: [None, Pending, Funded, Completed, Rejected, Cancelled] }
        claimable: { type: boolean }
        createdAt: { type: integer }
        timeoutAt: { type: integer }
        beneficiaryAllowed: { type: boolean }
        confirmations: { type: integer }
    ChallengeVerify:
      type: object
      required: [address, nonce, signature]
      properties:
        address: { type: string }
        nonce: { type: string }
        signature: { type: string }
    WebhookPayload:
      type: object
      required: [provider, eventId, occurredAt, address, status]
      properties:
        provider: { type: string, description: "KYC provider id; part of the (provider,eventId) uniqueness key." }
        eventId: { type: string, description: "Provider-assigned unique event id; part of the uniqueness key." }
        occurredAt: { type: integer, format: int64, description: "Provider decision time, unix seconds. Rejected if more than 24 hours in the past or 5 minutes in the future, or older than the latest applied decision for this address." }
        address: { type: string, description: "Subject wallet; normalized to EIP-55 checksum server-side." }
        status: { type: string, enum: [Allowed, Blocked, Pending], description: "Compliance decision." }
        validUntil: { type: integer, format: int64, description: "Expiry (unix seconds) for an Allowed decision; 0 = no expiry. A negative value, or one more than about 100 years ahead, is rejected." }
    KYCSession:
      type: object
      description: >
        A verification session issued by the configured KYC provider for the session's own
        wallet. Exactly one of `token` (consumed by the provider's embedded web SDK) or
        `url` (hosted redirect flow) is set, depending on the provider.
      required: [provider]
      properties:
        provider: { type: string, enum: [sumsub, onfido, generic], description: "Which provider issued this session; tells the SPA which SDK to launch." }
        token: { type: string, description: "Provider SDK/init token." }
        url: { type: string, description: "Hosted-flow URL to redirect the investor to." }
        ref: { type: string, description: "Provider-side reference for this verification (Onfido: workflowRunId). Bound server-side to the subject wallet so the provider's webhook can be resolved back to it." }
        expiresAt: { type: string, format: date-time, description: "When the token/URL stops being usable." }
    WebhookEvent:
      type: object
      properties:
        id: { type: string }
        eventId: { type: string }
        address: { type: string }
        provider: { type: string }
        outcome: { type: string, enum: [Allowed, Blocked, Pending] }
        occurredAt: { type: string, format: date-time }
        receivedAt: { type: string }
        applyStatus: { type: string, enum: [Accepted, Applying, Applied, Superseded, Failed, Recorded], description: "Durable inbox/outbox state. Applied only after the on-chain setStatus tx confirms." }
        applied: { type: boolean, description: "Derived convenience flag: applyStatus == Applied." }
    AuditLog:
      type: object
      properties:
        id: { type: string }
        category: { type: string }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        createdAt: { type: string }
        details: { type: object }
    Purchase:
      type: object
      properties:
        txHash: { type: string }
        buyer: { type: string }
        recipient: { type: string }
        tokenAmount: { type: string }
        quoteAmount: { type: string }
        blockNumber: { type: integer }
        confirmations: { type: integer }
    TxRef:
      type: object
      properties:
        txHash: { type: string }
        status: { type: string }
        idempotencyKey: { type: string }
    Transaction:
      type: object
      properties:
        txHash: { type: string }
        kind: { type: string }
        status: { type: string, enum: [pending, mined, confirmed, replaced, reverted, reorged, failed, broadcast_unknown, nonce_consumed_externally, needs_intervention] }
        blockNumber: { type: integer }
        explorerUrl: { type: string }
        # Identity and replacement lineage of a stuck or needs_intervention transaction
        sender: { type: string, description: "Signing account (from address)." }
        nonce: { type: integer, description: "Account nonce this attempt used." }
        replacedBy: { type: string, description: "txHash of the replacement, if this attempt was replaced." }
        replacementCount: { type: integer, description: "How many times this nonce has been fee-bumped or replaced." }
    StoredProfile:
      type: object
      description: >
        The deployment's single persisted Asset Profile (GET /api/v1/profile): the raw
        document plus the server-derived identity fields.
      required: [profile, projectId, profileDigest]
      properties:
        profile: { type: object, description: "The raw Asset Profile JSON document as stored." }
        projectId: { type: string }
        profileDigest: { type: string }
        cid: { type: string }
        decimals: { type: integer, description: "Token decimals derived from the profile." }
        tokenUnit: { type: string }
    AuthSession:
      type: object
      description: Response of POST /auth/session, the admin JWT and its metadata.
      required: [token, expiresAt, role, address]
      properties:
        token: { type: string, description: "Signed JWT; attach as `Authorization: Bearer <token>`." }
        expiresAt: { type: integer, description: "Unix seconds; JWT expiry." }
        role: { type: string, description: "Always 'admin' in V1 (single-admin model)." }
        address: { type: string, description: "The authenticated admin wallet address (checksummed)." }

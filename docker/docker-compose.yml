# Local development only; keep services private and do not deploy this file in production.
# Loopback ports expose unauthenticated MongoDB/IPFS locally. Production requires MongoDB
# authentication, a private/authenticated IPFS API and platform API TLS; see
# docs/operator/operator-guide.md.
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports: ["127.0.0.1:8545:8545"]
    volumes:
      - ./data/anvil:/anvil-data

  mongo:
    # Official mongo:7's root entrypoint adjusts /data/db ownership before running mongod as
    # mongodb;
    # this handles ordinary bind-mount ownership without manual chmod/chown. It includes mongosh
    # for the healthcheck and matches the API E2E image.
    image: mongo:7
    command: --replSet rs0 --bind_ip_all --port 27017
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }" | mongosh
      interval: 5s
      timeout: 15s
      start_period: 15s
      retries: 10
    # Production needs strong credentials in MongoDB and the server URI:
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: rwa
    #   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    environment:
      MONGO_INITDB_DATABASE: rwa
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - ./data/mongo:/data/db

  ipfs:
    image: ipfs/kubo:latest
    # Keep unauthenticated Kubo API 5001 on loopback for the server; leave gateway 8080
    # unpublished to avoid the server's default http.addr (:8080)
    ports: ["127.0.0.1:5001:5001"]
    volumes:
      - ./data/ipfs:/data/ipfs

volumes:
  rwa_mongo_data:
  rwa_ipfs_data:

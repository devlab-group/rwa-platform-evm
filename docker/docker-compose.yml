# Local development only; do not expose these services or deploy this file in production.
# Host ports bind to loopback, but MongoDB and IPFS are unauthenticated: anyone who can
# reach them has full access. Production needs MongoDB authentication, a private or
# authenticated IPFS API, and TLS for the platform API. See docs/operator/operator-guide.md.
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
    ports: ["127.0.0.1:8545:8545"]
    volumes:
      - ./data/anvil:/anvil-data

  mongo:
    # Docker-official image (not mongodb-community-server): its entrypoint runs as root,
    # chowns the mounted /data/db to the mongodb user, then drops privileges, so the host
    # bind mount below needs no chmod or chown. The community image runs as non-root and
    # cannot write to a bind mount owned by another user ("create_directory
    # /data/db/journal: Permission denied"). mongo:7 also bundles mongosh for the
    # healthcheck and matches the image the API e2e uses.
    image: mongo:7
    command: --replSet rs0 --bind_ip_all --port 27017
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }" | mongosh
      interval: 5s
      timeout: 15s
      start_period: 15s
      retries: 10
    # For production, set strong credentials and require them in the server URI
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: rwa
    #   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    environment:
      MONGO_INITDB_DATABASE: rwa
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - ./data/mongo:/data/db

  ipfs:
    image: ipfs/kubo:latest
    # Kubo's HTTP API (5001) is unauthenticated, so keep it on loopback only. The server
    # uses only this API; the gateway (8080) stays unpublished so it can't clash with the
    # server's default http.addr (:8080)
    ports: ["127.0.0.1:5001:5001"]
    volumes:
      - ./data/ipfs:/data/ipfs

volumes:
  rwa_mongo_data:
  rwa_ipfs_data:
